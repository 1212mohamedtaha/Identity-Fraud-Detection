[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.1.0"
description = "Verify claims (identity, CV skills, ...) with short adaptive conversations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "anthropic>=1.0",
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
verity = "verity.cli:main"

[tool.setuptools.packages.find]
include = ["verity*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.html", "*.css", "*.js", "*.svg", "*.pkl", "*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["verity/packs/identity/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]  # zip(strict=...) adds noise for no benefit here
