<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Identity Verification</title>
  <meta name="description" content="Answer a few questions so we can verify your identity.">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.5 4.5 5.5v5.7c0 4.6 3.1 8.8 7.5 10.3 4.4-1.5 7.5-5.7 7.5-10.3V5.5L12 2.5Zm-1.2 13.6-3.1-3.1 1.4-1.4 1.7 1.7 4-4 1.4 1.4-5.4 5.4Z"/></svg>
        </span>
        <div>
          <h1>Identity verification</h1>
          <p id="status" class="status" aria-live="polite">Getting ready…</p>
        </div>
      </div>
      <button id="restart" class="btn btn-ghost" type="button" disabled>Start over</button>
    </header>

    <main id="log" class="log" role="log" aria-live="polite" aria-label="Conversation"></main>

    <footer class="composer">
      <p id="notice" class="notice" role="alert" hidden></p>
      <p id="prompt" class="prompt" hidden>Choose an answer <span class="hint">· or press <kbd>A</kbd>–<kbd>D</kbd></span></p>
      <div id="choices" class="choices" role="group" aria-label="Answer options"></div>
    </footer>
  </div>
</body>
</html>
